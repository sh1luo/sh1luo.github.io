{{- $id := .id -}}
<div class="header-search {{ .class }}" data-site-search data-search-index="{{ "index.json" | relLangURL }}">
	<label class="screen-reader-text" for="site-search-{{ $id }}">搜索文章</label>
	<div class="header-search-field">
		<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
		<input id="site-search-{{ $id }}" type="search" inputmode="search" autocomplete="off" placeholder="搜索文章" aria-controls="search-panel-{{ $id }}" aria-expanded="false">
	</div>
	<div id="search-panel-{{ $id }}" class="header-search-panel" hidden>
		<p class="header-search-status" role="status" aria-live="polite">输入至少两个字符。</p>
		<ul class="header-search-results" aria-label="搜索结果"></ul>
	</div>
</div>
